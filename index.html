<section class="contact" id="kontakt">

<h2>Pošljite povpraševanje</h2>

<p>
Izpolnite obrazec in odgovorili vam bomo v najkrajšem možnem času.
</p>

<form action="https://formsubmit.co/info@stilnat.com" method="POST" style="max-width:700px;margin:50px auto;text-align:left;">

<input type="hidden" name="_subject" value="Novo povpraševanje - Stilnat">
<input type="hidden" name="_captcha" value="false">

<label style="font-weight:bold;">Ime in priimek *</label>

<input 
type="text" 
name="Ime" 
required
placeholder="Vnesite ime"
style="width:100%;padding:16px;margin-top:8px;margin-bottom:20px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;"
>

<label style="font-weight:bold;">Email *</label>

<input 
type="email" 
name="Email" 
required
placeholder="Vnesite email"
style="width:100%;padding:16px;margin-top:8px;margin-bottom:20px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;"
>

<label style="font-weight:bold;">Telefon</label>

<input 
type="tel" 
name="Telefon"
placeholder="Vnesite telefon"
style="width:100%;padding:16px;margin-top:8px;margin-bottom:20px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;"
>

<label style="font-weight:bold;">Storitev</label>

<select 
name="Storitev"
style="width:100%;padding:16px;margin-top:8px;margin-bottom:20px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;"
>

<option>Elektro dela</option>
<option>Vodovodna dela</option>
<option>Hišniška dela</option>
<option>Montaže</option>
<option>Drugo</option>

</select>

<label style="font-weight:bold;">Sporočilo *</label>

<textarea 
name="Sporočilo" 
required
rows="6"
placeholder="Opišite vaše povpraševanje..."
style="width:100%;padding:16px;margin-top:8px;margin-bottom:25px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;"
></textarea>

<button 
type="submit"
style="background:#f59e0b;color:white;padding:18px 34px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;"
>

Pošlji povpraševanje

</button>

</form>

<p style="margin-top:40px;font-size:20px;">
📞 031 705 782
</p>

</section>
